<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Redefinição de senha</title>
    </head>
    <body style="margin: 0; padding: 0; background-color: #f6f6f8">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
            <tr>
                <td align="center" style="padding: 32px 12px">
                    <table
                        role="presentation"
                        width="600"
                        cellspacing="0"
                        cellpadding="0"
                        style="max-width: 600px; background: #ffffff; border-radius: 14px"
                    >
                        <tr>
                            <td style="padding: 28px 40px; background: #1940b3; color: #ffffff">
                                <strong style="font-family: Georgia, serif; font-size: 20px"
                                    >Ateliê Guadalupe</strong
                                >
                            </td>
                        </tr>
                        <tr>
                            <td style="height: 4px; background: #d1a054"></td>
                        </tr>
                        <tr>
                            <td style="padding: 40px; font-family: Arial, Helvetica, sans-serif">
                                <h1 style="margin: 0 0 20px; color: #1f2937">
                                    Redefinição de senha
                                </h1>
                                <p style="color: #1f2937">Olá, {{customerName}}.</p>
                                <p style="color: #667085">
                                    Use o código abaixo para redefinir sua senha:
                                </p>
                                <p
                                    style="
                                        margin: 28px 0;
                                        font-size: 34px;
                                        font-weight: 700;
                                        letter-spacing: 8px;
                                        color: #1940b3;
                                    "
                                >
                                    {{resetCode}}
                                </p>
                                <p style="color: #667085">
                                    O código expira em {{expiresInMinutes}} minutos. Se você não
                                    solicitou esta alteração, ignore este e-mail.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
